name: Publish verified original-signed wide86 prerelease
on:
  push:
    branches: [test/wide86-gaode-observation]
    paths: ['release/wide86-same-cert/**','.github/workflows/publish-wide86-original-cert.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Reconstruct exact already-signed APK from verified unsigned build and public signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45929428696 --jq '.conclusion + " " + .head_sha' | grep -Fx 'success 64689011d04dc1d580cfe745e37018edd33be1ec'
          mkdir -p /tmp/unsigned /tmp/publish
          gh run download 45929428696 --name wide86-unsigned-NOT-installable --dir /tmp/unsigned
          cd /tmp/unsigned
          sha256sum -c wide86-unsigned-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          python3 release/wide86-same-cert/reconstruct.py /tmp/unsigned/Carrot-Bridge-wide.86-unsigned.apk /tmp/publish/Carrot-Bridge-wide.86.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs /tmp/publish/Carrot-Bridge-wide.86.apk > /tmp/cert.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: eb0f6a44174aecf09cedc237be2ca0305ea491d47b381407d31e903acbd34b46' /tmp/cert.txt
          "$bt/zipalign" -P 16 -c 4 /tmp/publish/Carrot-Bridge-wide.86.apk
          cd /tmp/publish
          echo 'e0f31266ce9ae9a0a757e9ddd4d9fd1098fa86eb79ab5e765fb814f19b1401f1  Carrot-Bridge-wide.86.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish distinct prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view wide.86 >/dev/null 2>&1; then exit 1; fi
          gh release create wide.86 /tmp/publish/Carrot-Bridge-wide.86.apk /tmp/publish/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Carrot Bridge wide.86｜高德資料觀察預發行' --notes-file release/wide86-same-cert/NOTES.md --prerelease --latest=false
          gh release view wide.86 --json isPrerelease,assets,url
