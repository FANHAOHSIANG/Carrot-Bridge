name: Publish original-signed wide83
on:
  pull_request:
    branches: [feature/full-auto-projection-20261125]
    paths: ['release/wide83-same-cert/**', '.github/workflows/publish-wide83-original-cert.yml']
  push:
    branches: [feature/full-auto-projection-20261125]
    paths: ['release/wide83-same-cert/**', '.github/workflows/publish-wide83-original-cert.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wide83-release-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Recover exact APK and verify original signer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/unsigned /tmp/base /tmp/publish
          gh run download 45745658062 --repo "$GITHUB_REPOSITORY" --name wide83-unsigned-not-for-installation --dir /tmp/unsigned
          gh release download wide.77 --repo "$GITHUB_REPOSITORY" --pattern Carrot-Bridge-wide.77.apk --dir /tmp/base
          echo "779c550c05ce5b59193f1c1b1a498e8f9b40f5d1eb27789514ab7ba14e51bc82  /tmp/base/Carrot-Bridge-wide.77.apk" | sha256sum -c -
          python3 release/wide83-same-cert/reconstruct.py /tmp/unsigned/Carrot-Bridge-wide.83-unsigned.apk /tmp/publish/Carrot-Bridge-wide.83.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs /tmp/base/Carrot-Bridge-wide.77.apk > /tmp/base-cert.txt
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs /tmp/publish/Carrot-Bridge-wide.83.apk > /tmp/rebuilt-cert.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/rebuilt-cert.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/rebuilt-cert.txt | head -n1)"
          test "$cert" = "$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/base-cert.txt | head -n1)"
          test "$cert" = 'eb0f6a44174aecf09cedc237be2ca0305ea491d47b381407d31e903acbd34b46'
          "$bt/zipalign" -P 16 -c 4 /tmp/publish/Carrot-Bridge-wide.83.apk
          cd /tmp/publish
          sha256sum Carrot-Bridge-wide.83.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wide83-original-signed
          path: /tmp/publish/*
  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feature/full-auto-projection-20261125'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wide83-original-signed
          path: /tmp/publish
      - name: Publish verified APK without overwriting a previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /tmp/publish
          sha256sum -c SHA256SUMS.txt
          echo '38e246a0d297cde2c0883b7a18821a44b260ffb180822246492e0090fc6a4a9a  Carrot-Bridge-wide.83.apk' | sha256sum -c -
          if gh release view wide.83 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Existing release; refusing overwrite"
            exit 1
          fi
          gh release create wide.83 Carrot-Bridge-wide.83.apk SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Carrot Bridge wide.83｜原簽章自動投屏更新' --notes '原簽章可覆蓋安裝；已通過建置及 APK v3 簽章檢查。保留上次投屏設定與高德出口資料接收。Stellar/Shizuku 服務必須可用且已授權，首次仍需正常授權。尚未實機確認自動投屏；不含新版 PRE 控速或轉向修改。' --latest=false
