name: GaodeProbe Android test APK
on:
  push:
    branches: [test/gaode-lane-probe]
    paths:
      - 'variants/gaode-lane-probe/android/**'
      - '.github/workflows/gaode-probe-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: bash variants/gaode-lane-probe/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GaodeProbe-0.1-link-test
          path: |
            variants/gaode-lane-probe/android/out/GaodeProbe-0.1-link-test.apk
            variants/gaode-lane-probe/android/out/SHA256SUMS.txt
          if-no-files-found: error
