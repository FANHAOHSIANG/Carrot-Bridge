name: Publish verified original-signed wide88 prerelease
on:
  push:
    branches: [test/wide88-amapauto-route-probe]
    paths: ['release/wide88-same-cert/**','.github/workflows/publish-wide88-original-cert.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Reconstruct exact already-signed APK from verified unsigned build and public signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/46024349057 --jq '.conclusion + " " + .head_sha' | grep -Fx 'success 7bd9c4598dfd1ca22542dcffb766e9dbdfa76c6f'
          mkdir -p /tmp/unsigned /tmp/publish
          gh run download 46024349057 --name wide88-unsigned-NOT-installable --dir /tmp/unsigned
          cd /tmp/unsigned
          sha256sum -c wide88-unsigned-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          python3 release/wide88-same-cert/reconstruct.py /tmp/unsigned/Carrot-Bridge-wide.88-unsigned.apk /tmp/publish/Carrot-Bridge-wide.88.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs /tmp/publish/Carrot-Bridge-wide.88.apk > /tmp/cert.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: eb0f6a44174aecf09cedc237be2ca0305ea491d47b381407d31e903acbd34b46' /tmp/cert.txt
          "$bt/zipalign" -P 16 -c 4 /tmp/publish/Carrot-Bridge-wide.88.apk
          cd /tmp/publish
          echo '0cbe7761a024372a9064671064a04ab9268e8d818cd3e7fc307286c9b375ef5a  Carrot-Bridge-wide.88.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish distinct prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view wide.88 >/dev/null 2>&1; then exit 1; fi
          gh release create wide.88 /tmp/publish/Carrot-Bridge-wide.88.apk /tmp/publish/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Carrot Bridge wide.88｜高德車機版路線資料採集預發行' --notes-file release/wide88-same-cert/NOTES.md --prerelease --latest=false
          gh release view wide.88 --json isPrerelease,assets,url
