name: Publish verified original-signed wide89 prerelease
on:
  push:
    branches: [test/wide89-lane-diagnostics]
    paths: ['release/wide89-same-cert/**','.github/workflows/publish-wide89-original-cert.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Reconstruct exact already-signed APK from verified unsigned build and public signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/46094912958 --jq '.conclusion + " " + .head_sha' | grep -Fx 'success 5f5ff31dc2f305ea4897d629c768d5dea37a94fd'
          mkdir -p /tmp/unsigned /tmp/publish
          gh run download 46094912958 --name wide89-unsigned-NOT-installable --dir /tmp/unsigned
          cd /tmp/unsigned
          sha256sum -c wide89-unsigned-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          python3 release/wide89-same-cert/reconstruct.py /tmp/unsigned/Carrot-Bridge-wide.89-unsigned.apk /tmp/publish/Carrot-Bridge-wide.89.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs /tmp/publish/Carrot-Bridge-wide.89.apk > /tmp/cert.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: eb0f6a44174aecf09cedc237be2ca0305ea491d47b381407d31e903acbd34b46' /tmp/cert.txt
          "$bt/zipalign" -P 16 -c 4 /tmp/publish/Carrot-Bridge-wide.89.apk
          cd /tmp/publish
          echo '68418c6919f00fe1f34bf4f03860753b5ddfc470a387df75725d46589c32802a  Carrot-Bridge-wide.89.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish distinct prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view wide.89 >/dev/null 2>&1; then exit 1; fi
          gh release create wide.89 /tmp/publish/Carrot-Bridge-wide.89.apk /tmp/publish/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Carrot Bridge wide.89｜雙高德車道資料即時觀察預發行' --notes-file release/wide89-same-cert/NOTES.md --prerelease --latest=false
          gh release view wide.89 --json isPrerelease,assets,url
