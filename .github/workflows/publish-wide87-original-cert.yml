name: Publish verified original-signed wide87 prerelease
on:
  push:
    branches: [test/wide87-amapauto-observation]
    paths: ['release/wide87-same-cert/**','.github/workflows/publish-wide87-original-cert.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Reconstruct exact already-signed APK from verified unsigned build and public signature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/$GITHUB_REPOSITORY/actions/runs/45943601636 --jq '.conclusion + " " + .head_sha' | grep -Fx 'success 1e0737841dba12a5b66cb81dbb9e45b3618390d5'
          mkdir -p /tmp/unsigned /tmp/publish
          gh run download 45943601636 --name wide87-unsigned-NOT-installable --dir /tmp/unsigned
          cd /tmp/unsigned
          sha256sum -c wide87-unsigned-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          python3 release/wide87-same-cert/reconstruct.py /tmp/unsigned/Carrot-Bridge-wide.87-unsigned.apk /tmp/publish/Carrot-Bridge-wide.87.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs /tmp/publish/Carrot-Bridge-wide.87.apk > /tmp/cert.txt
          grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/cert.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: eb0f6a44174aecf09cedc237be2ca0305ea491d47b381407d31e903acbd34b46' /tmp/cert.txt
          "$bt/zipalign" -P 16 -c 4 /tmp/publish/Carrot-Bridge-wide.87.apk
          cd /tmp/publish
          echo 'ae0bf10c45ff26bfafead2cce207f5dc66b5731b8fee56ac6d6504eee28c24f9  Carrot-Bridge-wide.87.apk' > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish distinct prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view wide.87 >/dev/null 2>&1; then exit 1; fi
          gh release create wide.87 /tmp/publish/Carrot-Bridge-wide.87.apk /tmp/publish/SHA256SUMS.txt --target "$GITHUB_SHA" --title 'Carrot Bridge wide.87｜高德車機版資料採集預發行' --notes-file release/wide87-same-cert/NOTES.md --prerelease --latest=false
          gh release view wide.87 --json isPrerelease,assets,url
