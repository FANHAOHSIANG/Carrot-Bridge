name: Publish wide81 full-auto projection with original signing certificate

on:
  push:
    branches: [feature/full-auto-projection-20261125]
    paths: ['release/wide81-same-cert/**', '.github/workflows/publish-wide81-original-cert.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-wide81-original-certificate-full-auto
  cancel-in-progress: false

jobs:
  verify-and-release:
    if: github.ref == 'refs/heads/feature/full-auto-projection-20261125'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Download exact previously tested unsigned APK and original wide.77
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/unsigned /tmp/base /tmp/publish
          gh run download 45548258654 --repo "$GITHUB_REPOSITORY" \
            --name wide81-unsigned-not-for-installation --dir /tmp/unsigned
          gh release download wide.77 --repo "$GITHUB_REPOSITORY" \
            --pattern Carrot-Bridge-wide.77.apk --dir /tmp/base
          echo "779c550c05ce5b59193f1c1b1a498e8f9b40f5d1eb27789514ab7ba14e51bc82  /tmp/base/Carrot-Bridge-wide.77.apk" | sha256sum -c -
          echo "3fd547142dd6cd7a89cddd79d9b1f7f5cc93668e7e941dc4c180db718e300d2a  /tmp/unsigned/Carrot-Bridge-wide.81-unsigned.apk" | sha256sum -c -
      - name: Reconstruct original-signer APK without private key
        run: |
          python3 release/wide81-same-cert/reconstruct.py \
            /tmp/unsigned/Carrot-Bridge-wide.81-unsigned.apk \
            /tmp/publish/Carrot-Bridge-wide.81-original-signed.apk
      - name: Verify official Android APK signature and exact certificate match
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/35.0.0"
          original=/tmp/base/Carrot-Bridge-wide.77.apk
          rebuilt=/tmp/publish/Carrot-Bridge-wide.81-original-signed.apk
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs "$original" > /tmp/base-cert.txt
          "$bt/apksigner" verify --min-sdk-version 31 --verbose --print-certs "$rebuilt" > /tmp/rebuilt-cert.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/rebuilt-cert.txt
          original_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/base-cert.txt | head -n1)"
          rebuilt_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/rebuilt-cert.txt | head -n1)"
          test -n "$original_cert"
          test "$original_cert" = "$rebuilt_cert"
          test "$rebuilt_cert" = 'eb0f6a44174aecf09cedc237be2ca0305ea491d47b381407d31e903acbd34b46'
          "$bt/zipalign" -P 16 -c 4 "$rebuilt"
          sha256sum "$rebuilt" > /tmp/publish/Carrot-Bridge-wide.81-original-signed.apk.sha256
          echo "PASS: APK v2 signature and original wide.77 certificate match, same-package upgrade supported"
      - name: Release verified original-signed APK (preserve old versions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=wide.81-full-auto-original-signed-20261125
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Already released; refuse to overwrite test APK"
            exit 1
          fi
          cat > /tmp/notes.md <<'NOTES'
          # Carrot Bridge wide.81｜全自動投屏（原簽章測試）

          此 APK 使用與 wide.77 相同的原始簽章，經 Android 官方 apksigner 驗證，可以嘗試直接覆蓋既有 wide.77／wide.80 原簽章版本。

          **使用方式**：開啟 Carrot Bridge；當 Stellar 或 Shizuku 服務正在執行、原有授權仍有效時，App 會自動投屏，無須再按「開始投屏」。

          - 服務延後啟動時，自動等待並接續投屏。
          - 尚未授權時，自動提出原本的授權要求一次，**不會替使用者按「允許」**；被拒後不會重複跳窗。
          - 分區一（左側）是高德／Google 導航；分區二（右側）是神盾、其他 App 或空白。
          - 保留 wide.77 日夜切換穩定性及 wide.79 導航預調。
          - Android 首次授權或撤銷後重新授權仍需使用者同意；無 root Shizuku 重新開機後可能仍須啟動服務。
          - 原 JKS／私鑰只在私人環境處理，GitHub 只儲存對本次 APK 專用的公開 RSA 簽章與雜湊鎖定重建腳本。
          - GitHub 已確認 APK 簽章與 wide.77 憑證指紋完全一致；**尚未完成實機投屏驗收**。

          請下載 **Carrot-Bridge-wide.81-original-signed.apk**。先前簽章不同的 wide.80-auto-restore-test-20261124 不能直接覆蓋舊版。
          NOTES
          gh release create "$tag" \
            /tmp/publish/Carrot-Bridge-wide.81-original-signed.apk \
            /tmp/publish/Carrot-Bridge-wide.81-original-signed.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title 'Carrot Bridge wide.81 原簽章｜自動投屏測試' \
            --notes-file /tmp/notes.md --prerelease --latest=false
